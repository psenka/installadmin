[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "install-admin"
version = "1.0.0"
description = "GUI pro správu winget balíčků"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
]

[project.scripts]
install-admin = "install_admin.main:main"

[tool.setuptools.packages.find]
where = ["src"]